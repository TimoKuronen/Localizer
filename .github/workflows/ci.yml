name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Localizer.slnx

      - name: Build
        run: dotnet build Localizer.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test Localizer.slnx --no-build --configuration Release --verbosity normal
